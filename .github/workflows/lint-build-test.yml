name: Lint & Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
        cache: 'npm'
    - run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install
    - uses: actions/cache@v3
      id: cache-dependencies
      with:
        path: '.'
        key: ${{ github.sha }}

  ci:
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - uses: actions/cache@v3
      id: restore-dependencies
      with:
        path: '.'
        key: ${{ github.sha }}
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
    - name: Test
      run: npm run test
